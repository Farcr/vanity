modLoader = "javafml"
loaderVersion = "[1,)"
issueTrackerURL = "https://github.com/Farcr/Vanity/issues"
license = "https://github.com/Farcr/vanity/blob/8740a407830c38eea84a955854691e909cc71bd7/LICENSE"

[[mods]]
    modId = "vanity"
    version = "${version}"
    displayName = "Vanity"
    description = "Apply any look you want to your items, and make your own Vanity Packs to share with the world."
    authors = "Farcr, ThatGravyBoat"
    credits = "Jackson, Ocelot"
    displayURL = "https://modrinth.com/project/vanity-core"

[modproperties.vanity]
    catalogueImageIcon="vanity.icon.png"

[[mixins]]
    config="vanity-common.mixins.json"
[[mixins]]
    config="vanity-neo.mixins.json"

[[dependencies.vanity]]
    modId = "neoforge"
    type="required"
    versionRange = "[21.0,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.vanity]]
    modId = "minecraft"
    type="required"
    versionRange = "[1.21,)"
    ordering = "AFTER"
    side = "BOTH"